spring:
  application:
    name: studyai-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/studyai
    username: studyai
    password: ritej
    
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:studyai-super-secret-key-256-bits-minimum-required-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:4200}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  rate-limit:
    login-capacity: 5
    login-refill-minutes: 15

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.studyai: INFO
    org.springframework.security: WARN
