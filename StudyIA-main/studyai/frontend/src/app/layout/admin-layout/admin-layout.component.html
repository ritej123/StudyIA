<div class="layout-wrapper" [class.sidebar-collapsed]="isSidebarCollapsed()">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon admin-icon">
          <mat-icon>admin_panel_settings</mat-icon>
        </div>
        <span class="brand-name" *ngIf="!isSidebarCollapsed()">Study<span class="gradient-text">AI</span></span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title" *ngIf="!isSidebarCollapsed()">ADMINISTRATION</div>

      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item" [matTooltip]="isSidebarCollapsed() ? 'Dashboard' : ''" matTooltipPosition="right">
        <mat-icon>dashboard</mat-icon>
        <span class="nav-label" *ngIf="!isSidebarCollapsed()">Tableau de bord</span>
      </a>

      <a routerLink="/admin/users" routerLinkActive="active" class="nav-item" [matTooltip]="isSidebarCollapsed() ? 'Gestion des comptes' : ''" matTooltipPosition="right">
        <mat-icon>people</mat-icon>
        <span class="nav-label" *ngIf="!isSidebarCollapsed()">Gestion des comptes</span>
      </a>
    </nav>

    <div class="sidebar-footer" *ngIf="!isSidebarCollapsed()">
      <div class="user-info-card">
        <div class="user-avatar-mini">
          <mat-icon>security</mat-icon>
        </div>
        <div class="user-details">
          <span class="user-name">{{ authService.userFullName() || 'Administrateur' }}</span>
          <span class="user-role-badge">Superviseur</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <button mat-icon-button (click)="toggleSidebar()" class="menu-btn" aria-label="Basculer le menu">
          <mat-icon>{{ isSidebarCollapsed() ? 'menu' : 'menu_open' }}</mat-icon>
        </button>
        <span class="admin-badge">ADMIN</span>
        <span class="workspace-title">Portail d'Administration</span>
      </div>

      <div class="header-right">
        <!-- Toggle Dark/Light Mode -->
        <button mat-icon-button (click)="themeService.toggleTheme()" [matTooltip]="themeService.isDarkMode() ? 'Passer au mode clair' : 'Passer au mode sombre'">
          <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <!-- User Menu -->
        <button mat-button [matMenuTriggerFor]="adminMenu" class="user-menu-btn">
          <div class="avatar-circle admin-avatar">
            {{ (authService.currentUser()?.firstName?.charAt(0) || 'A').toUpperCase() }}
          </div>
          <span class="header-user-name">{{ authService.currentUser()?.firstName }}</span>
          <mat-icon>expand_more</mat-icon>
        </button>

        <mat-menu #adminMenu="matMenu" xPosition="before" class="app-user-menu">
          <div class="menu-header">
            <strong>{{ authService.userFullName() }}</strong>
            <small>{{ authService.currentUser()?.email }}</small>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()" class="logout-menu-item">
            <mat-icon color="warn">logout</mat-icon>
            <span class="logout-text">Déconnexion</span>
          </button>
        </mat-menu>
      </div>
    </header>

    <!-- Router Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
